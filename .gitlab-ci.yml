stages:
  - build
  - scan
  - sign
  - deploy

variables:
  HARBOR_REGISTRY: harbor.example.com
  IMAGE_REPO: harbor.example.com/demo/democicd
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $IMAGE_REPO:$IMAGE_TAG
  VAULT_ADDR: https://vault.example.com
  VAULT_SKIP_VERIFY: "true"
  GITOPS_REPO_ID: "3"
  GITOPS_DEPLOY_FILE: k8s-lab-01%2Fdemocicd%2Fdeployment.yaml

.vault_token: &vault_token
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /dockerconfig
  script:
    - /kaniko/executor --force
        --registry-mirror harbor.example.com/dockerhub-proxy
        --skip-tls-verify
        --skip-tls-verify-pull
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$IMAGE"
        --digest-file "$CI_PROJECT_DIR/image-digest.txt"
    - DIGEST=$(cat "$CI_PROJECT_DIR/image-digest.txt")
    - printf 'IMAGE_DIGEST=%s\nIMAGE_REF=%s@%s\n' "$DIGEST" "$IMAGE_REPO" "$DIGEST" > build.env
  artifacts:
    reports:
      dotenv: build.env
  tags: [kubernetes]
  only: [main]

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  <<: *vault_token
  script:
    - apk add --no-cache curl
    - |
      export VAULT_TOKEN=$(curl -sfk -X POST -H 'Content-Type: application/json' \
        -d "{\"role\":\"ci-cosign\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
        $VAULT_ADDR/v1/auth/jwt/login | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
      SECRET=$(curl -sfk -H "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/ci/harbor)
      export TRIVY_USERNAME=$(echo "$SECRET" | sed 's/.*"username":"\([^"]*\)".*/\1/')
      export TRIVY_PASSWORD=$(echo "$SECRET" | sed 's/.*"password":"\([^"]*\)".*/\1/')
      export TRIVY_INSECURE=true
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"
  tags: [kubernetes]
  only: [main]

sign:
  stage: sign
  image: alpine:3.19
  <<: *vault_token
  dependencies: [build]
  script:
    - apk add --no-cache curl unzip
    - wget -qO /tmp/vault.zip https://releases.hashicorp.com/vault/1.17.0/vault_1.17.0_linux_amd64.zip && unzip -q /tmp/vault.zip -d /usr/local/bin/
    - wget -qO /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64 && chmod +x /usr/local/bin/cosign
    - |
      export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role=ci-cosign jwt="$VAULT_ID_TOKEN")
      vault kv get -field=private_key secret/ci/cosign > /tmp/cosign.key
      export COSIGN_PASSWORD=$(vault kv get -field=password secret/ci/cosign)
      HARBOR_USER=$(vault kv get -field=username secret/ci/harbor)
      HARBOR_PASS=$(vault kv get -field=password secret/ci/harbor)
      mkdir -p /root/.docker
      echo "{\"auths\":{\"harbor.example.com\":{\"auth\":\"$(echo -n "$HARBOR_USER:$HARBOR_PASS" | base64 | tr -d '\n')\"}}}" > /root/.docker/config.json
      cosign sign --key /tmp/cosign.key --yes "$IMAGE_REF"
      rm -f /tmp/cosign.key /root/.docker/config.json
  tags: [kubernetes]
  only: [main]

deploy:
  stage: deploy
  image: alpine:3.19
  <<: *vault_token
  dependencies: [build]
  script:
    - apk add --no-cache curl
    - |
      set -eu
      if [ -n "${GITOPS_TOKEN_OVERRIDE:-}" ]; then
        GITOPS_TOKEN="$GITOPS_TOKEN_OVERRIDE"
      else
        VAULT_TOKEN=$(curl -sfk -X POST \
          -H 'Content-Type: application/json' \
          -d "{\"role\":\"ci-cosign\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
          $VAULT_ADDR/v1/auth/jwt/login | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
        GITOPS_TOKEN=$(curl -sfk -H "X-Vault-Token: $VAULT_TOKEN" \
          $VAULT_ADDR/v1/secret/data/ci/gitops | sed 's/.*"token":"\([^"]*\)".*/\1/')
      fi
      FILE_JSON=$(curl -sfk -H "PRIVATE-TOKEN: $GITOPS_TOKEN" \
        "https://gitlab.example.com/api/v4/projects/$GITOPS_REPO_ID/repository/files/$GITOPS_DEPLOY_FILE?ref=main")
      LAST_COMMIT_ID=$(printf '%s' "$FILE_JSON" | sed 's/.*"last_commit_id":"\([^"]*\)".*/\1/')
      NEW_CONTENT=$(printf '%s' "$FILE_JSON" | sed 's/.*"content":"\([^"]*\)".*/\1/' | \
        tr -d '\n' | base64 -d | \
        sed "s|image: harbor.example.com/demo/democicd.*|image: $IMAGE_REF|" | \
        base64 | tr -d '\n')
      HTTP_STATUS=$(curl -sk -o /tmp/gitops-update-response.json -w "%{http_code}" -X PUT \
        -H "PRIVATE-TOKEN: $GITOPS_TOKEN" \
        -H 'Content-Type: application/json' \
        "https://gitlab.example.com/api/v4/projects/$GITOPS_REPO_ID/repository/files/$GITOPS_DEPLOY_FILE" \
        -d "{\"branch\":\"main\",\"last_commit_id\":\"$LAST_COMMIT_ID\",\"content\":\"$NEW_CONTENT\",\"encoding\":\"base64\",\"commit_message\":\"chore: update democicd image to $CI_COMMIT_SHORT_SHA ($IMAGE_DIGEST)\"}")
      if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
        echo "GitOps update failed with HTTP $HTTP_STATUS"
        cat /tmp/gitops-update-response.json
        exit 1
      fi
  tags: [kubernetes]
  only: [main]
