stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build_image:
  stage: build
  tags:
    - docker
  image: docker:20.10
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - 'echo "Building Docker image with tag: $IMAGE_TAG"'
    - 'docker build -t $IMAGE_TAG .'
    - 'echo "Pushing Docker image to registry: $IMAGE_TAG"'
    - 'docker push $IMAGE_TAG'

deploy_to_k8s:
  stage: deploy
  tags:
    - kubernetes  # 3. Используем K8s-раннер (тег, который ты задал при установке)
  image:
    name: bitnami/kubectl:latest  # 4. Берем образ, где есть kubectl
    entrypoint: [""]
  script:
    - 'echo "Deploying image $IMAGE_TAG to Kubernetes..."'
    - 'sed -i "s|image: <PLACEHOLDER>|image: $IMAGE_TAG|g" Deployment.yaml'
    - 'kubectl apply -f Deployment.yaml'
    - 'kubectl apply -f Service.yaml'
    - 'echo "Deployment successful!"'    
