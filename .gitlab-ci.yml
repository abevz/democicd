stages:
  - build
  - scan
  - sign
  - deploy

variables:
  HARBOR_REGISTRY: harbor.bevz.net
  IMAGE: harbor.bevz.net/demo/democicd:$CI_COMMIT_SHORT_SHA
  VAULT_ADDR: https://vault.bevz.net
  GITOPS_REPO_ID: "3"
  GITOPS_DEPLOY_FILE: k8s-lab-01%2Fdemocicd%2Fdeployment.yaml

.vault_token: &vault_token
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.bevz.net

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  <<: *vault_token
  script:
    - |
      VAULT_TOKEN=$(wget -qO- --header "Content-Type: application/json" \
        --post-data "{\"role\":\"ci-cosign\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
        $VAULT_ADDR/v1/auth/jwt/login | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
      SECRET=$(wget -qO- --header "X-Vault-Token: $VAULT_TOKEN" \
        $VAULT_ADDR/v1/secret/data/ci/harbor)
      HARBOR_USER=$(echo "$SECRET" | sed 's/.*"username":"\([^"]*\)".*/\1/')
      HARBOR_PASS=$(echo "$SECRET" | sed 's/.*"password":"\([^"]*\)".*/\1/')
      mkdir -p /kaniko/.docker
      AUTH=$(echo -n "$HARBOR_USER:$HARBOR_PASS" | base64 | tr -d '\n')
      echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE"
  tags: [kubernetes]
  only: [main]

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  <<: *vault_token
  script:
    - |
      VAULT_TOKEN=$(wget -qO- --header "Content-Type: application/json" \
        --post-data "{\"role\":\"ci-cosign\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
        $VAULT_ADDR/v1/auth/jwt/login | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
      SECRET=$(wget -qO- --header "X-Vault-Token: $VAULT_TOKEN" \
        $VAULT_ADDR/v1/secret/data/ci/harbor)
      export HARBOR_USER=$(echo "$SECRET" | sed 's/.*"username":"\([^"]*\)".*/\1/')
      export HARBOR_PASS=$(echo "$SECRET" | sed 's/.*"password":"\([^"]*\)".*/\1/')
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --username "$HARBOR_USER" --password "$HARBOR_PASS" "$IMAGE"
  tags: [kubernetes]
  only: [main]

sign:
  stage: sign
  image: alpine:3.19
  <<: *vault_token
  script:
    - apk add --no-cache curl unzip
    - wget -qO /tmp/vault.zip https://releases.hashicorp.com/vault/1.17.0/vault_1.17.0_linux_amd64.zip && unzip -q /tmp/vault.zip -d /usr/local/bin/
    - wget -qO /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64 && chmod +x /usr/local/bin/cosign
    - |
      export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role=ci-cosign jwt="$VAULT_ID_TOKEN")
      vault kv get -field=private_key secret/ci/cosign > /tmp/cosign.key
      cosign sign --key /tmp/cosign.key --yes "$IMAGE"
      rm -f /tmp/cosign.key
  tags: [kubernetes]
  only: [main]

deploy:
  stage: deploy
  image: alpine:3.19
  <<: *vault_token
  script:
    - apk add --no-cache curl
    - |
      VAULT_TOKEN=$(curl -sf -X POST -H 'Content-Type: application/json' \
        -d "{\"role\":\"ci-cosign\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
        $VAULT_ADDR/v1/auth/jwt/login | sed 's/.*"client_token":"\([^"]*\)".*/\1/')
      GITOPS_TOKEN=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" \
        $VAULT_ADDR/v1/secret/data/ci/gitops | sed 's/.*"token":"\([^"]*\)".*/\1/')
      FILE_JSON=$(curl -sf -H "PRIVATE-TOKEN: $GITOPS_TOKEN" \
        "https://gitlab.bevz.net/api/v4/projects/$GITOPS_REPO_ID/repository/files/$GITOPS_DEPLOY_FILE?ref=main")
      CONTENT=$(echo "$FILE_JSON" | sed 's/.*"content":"\([^"]*\)".*/\1/')
      NEW_CONTENT=$(echo "$CONTENT" | base64 -d | \
        sed "s|image: harbor.bevz.net/demo/democicd:.*|image: $IMAGE|" | \
        base64 | tr -d '\n')
      curl -sf -X PUT \
        -H "PRIVATE-TOKEN: $GITOPS_TOKEN" \
        -H 'Content-Type: application/json' \
        "https://gitlab.bevz.net/api/v4/projects/$GITOPS_REPO_ID/repository/files/$GITOPS_DEPLOY_FILE" \
        -d "{\"branch\":\"main\",\"content\":\"$NEW_CONTENT\",\"encoding\":\"base64\",\"commit_message\":\"chore: update democicd image to $CI_COMMIT_SHORT_SHA\"}"
  tags: [kubernetes]
  only: [main]
