name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "2.12.2"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run test race
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin v${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: golangci-lint run

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: go build -o helloworld .

      - name: Smoke test
        run: |
          ./helloworld &
          sleep 2
          curl -sf http://localhost:8080 | grep -q "Hello, World!"
          kill %1

  docker:
    name: Docker Build
    #runs-on: ubuntu-latest
    needs: [lint, build]
    uses: abevz/ci-templates/.github/workflows/build.yml@v1
    with:
      image_name: democicd
    permissions:
      contents: read
      packages: write

  aws-oidc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@<SHA> # v4
        with:
          role-to-assume: arn:aws:iam::492613460415:role/gha-democicd-oidc-lab
          aws-region: eu-central-2
      - run: aws sts get-caller-identity

